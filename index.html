<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <meta name="theme-color" content="#16423c">

  <title>週間シフト表</title>

  <style>
    :root {
      --green: #16423c;
      --background: #f7f4ed;
      --card: #ffffff;
      --line: #d8dedb;
      --text: #18211e;
      --muted: #65716c;
      --danger: #b42318;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        sans-serif;
      background: var(--background);
      color: var(--text);
    }

    button,
    select,
    input {
      font: inherit;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 13px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      filter: brightness(0.97);
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 14px 16px;
      background: var(--green);
      color: white;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.14);
    }

    .header-content {
      width: 100%;
      max-width: 1450px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.15);
      font-size: 22px;
    }

    h1 {
      margin: 0;
      font-size: 21px;
    }

    .subtitle {
      margin-top: 2px;
      font-size: 11px;
      opacity: 0.8;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
    }

    .header-actions button,
    .header-actions select {
      background: white;
      color: var(--green);
      border: 0;
      border-radius: 9px;
      padding: 9px 11px;
      font-weight: 700;
    }

    main {
      max-width: 1450px;
      margin: auto;
      padding: 16px;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
      padding: 12px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 6px 20px rgba(22, 66, 60, 0.08);
    }

    .week-navigation {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .week-navigation strong {
      min-width: 160px;
      text-align: center;
    }

    .toolbar-buttons {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }

    .toolbar button {
      background: #e9f0ed;
      color: var(--green);
    }

    .toolbar button.active {
      background: var(--green);
      color: white;
    }

    .hint {
      width: 100%;
      color: var(--muted);
      font-size: 12px;
    }

    .staff-management {
      margin-bottom: 12px;
      padding: 12px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 6px 20px rgba(22, 66, 60, 0.08);
    }

    .staff-management h2 {
      margin: 0 0 10px;
      font-size: 16px;
    }

    .staff-chip-list {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }

    .staff-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 8px 7px 11px;
      border: 1px solid #ced8d3;
      border-radius: 999px;
      background: #f7faf8;
      font-size: 13px;
      font-weight: 700;
    }

    .staff-chip button {
      padding: 3px 7px;
      background: #fee2e2;
      color: var(--danger);
      font-size: 11px;
    }

    .desktop-board {
      background: white;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(22, 66, 60, 0.1);
    }

    .scroll-area {
      overflow: auto;
      max-height: 74vh;
    }

    .shift-grid {
      display: grid;
      grid-template-columns: 165px repeat(7, minmax(185px, 1fr));
      min-width: 1460px;
    }

    .cell {
      min-height: 135px;
      padding: 8px;
      background: white;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .header-cell {
      min-height: auto;
      padding: 12px 8px;
      background: var(--green);
      color: white;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 3;
    }

    .staff-cell {
      background: #eef4f1;
      font-weight: 800;
      position: sticky;
      left: 0;
      z-index: 2;
    }

    .header-cell.staff-cell {
      z-index: 4;
    }

    .staff-name-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 6px;
    }

    .staff-name {
      overflow-wrap: anywhere;
    }

    .delete-staff-button {
      flex-shrink: 0;
      padding: 5px 7px;
      background: #fee2e2;
      color: var(--danger);
      font-size: 12px;
    }

    .weekly-hours {
      margin-top: 7px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 500;
    }

    .shift-entry {
      margin-bottom: 7px;
      padding: 9px;
      border: 1px solid #cfd8d4;
      border-left: 5px solid #aab8b2;
      border-radius: 10px;
      background: #fafcfb;
    }

    .task-meeting-border {
      border-left-color: #7c3aed;
    }

    .task-floor-border {
      border-left-color: #2563eb;
    }

    .task-kitchen-border {
      border-left-color: #16a34a;
    }

    .task-other-border {
      border-left-color: #607d8b;
    }

    .shift-time {
      font-size: 15px;
      font-weight: 850;
      letter-spacing: 0.1px;
    }

    .task-badge {
      display: inline-block;
      margin-top: 5px;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
    }

    .task-meeting {
      background: #ede9fe;
      color: #6d28d9;
    }

    .task-floor {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .task-kitchen {
      background: #dcfce7;
      color: #166534;
    }

    .task-other {
      background: #eceff1;
      color: #455a64;
    }

    .shift-detail {
      margin-top: 5px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.4;
    }

    .shift-entry-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 7px;
    }

    .copy-next-day-button {
      padding: 6px 8px;
      background: #e8f0ed;
      color: var(--green);
      border: 1px solid #c9d8d2;
      border-radius: 7px;
      font-size: 11px;
      font-weight: 700;
    }

    .copy-next-day-button:hover {
      background: #dbe9e3;
    }

    .add-task-button {
      width: 100%;
      background: #edf3f0;
      color: #41665d;
      font-size: 12px;
    }

    .mobile-board {
      display: none;
    }

    .mobile-day-card {
      margin-bottom: 12px;
      overflow: hidden;
      background: white;
      border-radius: 14px;
      box-shadow: 0 6px 20px rgba(22, 66, 60, 0.09);
    }

    .mobile-day-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 13px 14px;
      background: var(--green);
      color: white;
    }

    .mobile-day-header h2 {
      margin: 0;
      font-size: 17px;
    }

    .mobile-date {
      font-size: 13px;
      opacity: 0.85;
    }

    .mobile-day-content {
      padding: 10px;
    }

    .mobile-staff-card {
      margin-bottom: 9px;
      padding: 11px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: #fcfdfc;
    }

    .mobile-staff-card:last-child {
      margin-bottom: 0;
    }

      display: flex;
      justify
