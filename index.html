<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>週間シフト表</title><style>
:root{--g:#16423c;--bg:#f7f4ed;--line:#d8dedb}*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:#18211e}header{padding:14px 18px;background:var(--g);color:#fff;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}h1{font-size:21px;margin:0}button,select,input{font:inherit}button{border:0;border-radius:9px;padding:9px 12px;font-weight:700;cursor:pointer}.actions{display:flex;gap:8px}main{padding:16px}.toolbar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}.week{display:flex;gap:8px;align-items:center}.hint{font-size:12px;color:#65716c}.board{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 8px 24px #16423c1a}.scroll{overflow:auto;max-height:75vh}.grid{display:grid;grid-template-columns:140px repeat(7,minmax(170px,1fr));min-width:1330px}.cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:7px;min-height:130px}.head{background:var(--g);color:#fff;text-align:center;min-height:auto;position:sticky;top:0;z-index:3}.name{background:#eef4f1;font-weight:800;position:sticky;left:0;z-index:2}.head.name{z-index:4}.entry{border:1px solid #cfd8d4;border-radius:9px;padding:7px;margin-bottom:6px;background:#fafcfb}.time{font-size:13px;font-weight:800}.badge{display:inline-block;margin-top:4px;padding:3px 7px;border-radius:999px;font-size:11px;font-weight:800}.meeting{background:#ede9fe;color:#6d28d9}.floor{background:#dbeafe;color:#1d4ed8}.kitchen{background:#dcfce7;color:#166534}.other{background:#eceff1;color:#455a64}.detail,.hours{font-size:11px;color:#65716c;margin-top:4px}.add{width:100%;background:#edf3f0;color:#55716a}.delete{background:#fee2e2;color:#991b1b}dialog{border:0;border-radius:16px;padding:0;width:min(94vw,520px);box-shadow:0 24px 70px #0005}dialog::backdrop{background:#0007}.modal{padding:20px}.modal h2{margin:0 0 4px}.date{color:#65716c;margin:0 0 14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;font-size:12px;font-weight:800;margin:11px 0 5px}.modal select,.modal input{width:100%;padding:10px;border:1px solid #ccd5d1;border-radius:8px}.meetingBox{display:none}.meetingBox.show{display:block}.existing{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px;margin:5px 0;border:1px solid #ddd;border-radius:8px}.modalActions{display:flex;justify-content:space-between;margin-top:18px}.primary{background:var(--g);color:#fff}@media print{header,.toolbar,.add{display:none}.scroll{overflow:visible;max-height:none}.grid{min-width:0;grid-template-columns:100px repeat(7,1fr)}.head,.name{position:static}}
</style></head><body><header><h1 id="pageTitle"></h1><div class="actions"><select id="language"><option value="ja">日本語</option><option value="en">English</option></select><button id="addStaff"></button><button id="print"></button></div></header><main><div class="toolbar"><div class="week"><button id="prev">‹</button><strong id="weekTitle"></strong><button id="next">›</button></div><span class="hint" id="hint"></span></div><div class="board"><div class="scroll"><div class="grid" id="grid"></div></div></div></main>
<dialog id="editor"><div class="modal"><h2 id="editorTitle"></h2><p class="date" id="editorDate"></p><div id="entries"></div><hr><strong id="newTask"></strong><div class="row"><div><label id="startLabel"></label><select id="start"></select></div><div><label id="endLabel"></label><select id="end"></select></div></div><label id="taskLabel"></label><select id="task"></select><div class="meetingBox" id="meetingBox"><label id="personLabel"></label><input id="person"></div><label id="memoLabel"></label><input id="memo"><div class="modalActions"><button id="close"></button><button class="primary" id="save"></button></div></div></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id);const TXT={ja:{title:'週間シフト表',staff:'＋ スタッフ追加',print:'印刷・PDF',hint:'5分刻みで、同じ日に複数の時間・タスクを登録できます。',staffHead:'スタッフ',days:['月','火','水','木','金','土','日'],edit:'シフト編集',new:'新しい時間・タスクを追加',start:'開始時間',end:'終了時間',task:'タスク',person:'誰とミーティングですか？',personPH:'例：店長、田中さん、取引先',memo:'メモ（任意）',close:'閉じる',save:'追加',add:'＋ 時間・タスク追加',hours:'週 {n}時間',name:'スタッフ名を入力してください',del:'削除',confirm:'削除しますか？',invalid:'終了時間は開始時間より後にしてください。',required:'ミーティング相手を入力してください。',tasks:[['meeting','ミーティング'],['floor','ホール'],['kitchen','キッチン'],['other','その他']],with:'相手'},en:{title:'Weekly Shift Schedule',staff:'+ Add staff',print:'Print / PDF',hint:'Add multiple times and tasks in five-minute increments.',staffHead:'Staff',days:['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],edit:'Edit Shift',new:'Add another time and task',start:'Start time',end:'End time',task:'Task',person:'Who is the meeting with?',personPH:'Example: Manager or supplier',memo:'Note (optional)',close:'Close',save:'Add',add:'+ Add time & task',hours:'{n} hrs/week',name:'Enter staff name',del:'Delete',confirm:'Delete this task?',invalid:'End time must be later than start time.',required:'Enter the meeting participant.',tasks:[['meeting','Meeting'],['floor','Floor'],['kitchen','Kitchen'],['other','Other']],with:'With'}};
const KEY='restaurantShiftStableV1';let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!data)data={lang:'ja',staff:['田中','山田','鈴木','佐藤'],shifts:{}};let monday=getMonday(new Date()),active=null;function tr(k){return TXT[data.lang][k]}function saveLocal(){localStorage.setItem(KEY,JSON.stringify(data))}function getMonday(d){d=new Date(d);const day=d.getDay()||7;d.setHours(0,0,0,0);d.setDate(d.getDate()-day+1);return d}function dateKey(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}function displayDate(d){return data.lang==='ja'?`${d.getMonth()+1}/${d.getDate()}`:`${d.getDate()}/${d.getMonth()+1}`}function mins(v){const p=v.split(':').map(Number);return p[0]*60+p[1]}function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function taskName(id){const x=tr('tasks').find(a=>a[0]===id);return x?x[1]:id}function timeOptions(){let s='';for(let h=0;h<=29;h++)for(let m=0;m<60;m+=5){const v=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');s+=`<option value="${v}">${v}</option>`}return s}
function render(){document.documentElement.lang=data.lang;$('pageTitle').textContent=tr('title');$('addStaff').textContent=tr('staff');$('print').textContent=tr('print');$('hint').textContent=tr('hint');$('language').value=data.lang;const end=new Date(monday);end.setDate(end.getDate()+6);$('weekTitle').textContent=`${displayDate(monday)} - ${displayDate(end)}`;let h=`<div class="cell head name">${tr('staffHead')}</div>`;for(let i=0;i<7;i++){const d=new Date(monday);d.setDate(d.getDate()+i);h+=`<div class="cell head">${tr('days')[i]}<br><small>${displayDate(d)}</small></div>`}data.staff.forEach((name,si)=>{let total=0;for(let i=0;i<7;i++){const d=new Date(monday);d.setDate(d.getDate()+i);(data.shifts[si+'|'+dateKey(d)]||[]).forEach(x=>total+=(mins(x.end)-mins(x.start))/60)}h+=`<div class="cell name">${esc(name)}<div class="hours">${tr('hours').replace('{n}',total.toFixed(1))}</div></div>`;for(let i=0;i<7;i++){const d=new Date(monday);d.setDate(d.getDate()+i);const dk=dateKey(d),arr=data.shifts[si+'|'+dk]||[];h+=`<div class="cell">${arr.map(x=>`<div class="entry"><div class="time">${x.start} - ${x.end}</div><span class="badge ${x.taskId}">${esc(taskName(x.taskId))}</span>${x.taskId==='meeting'?`<div class="detail">${tr('with')}: ${esc(x.person)}</div>`:''}${x.memo?`<div class="detail">${esc(x.memo)}</div>`:''}</div>`).join('')}<button class="add" data-si="${si}" data-date="${dk}">${tr('add')}</button></div>`}});$('grid').innerHTML=h;document.querySelectorAll('.add').forEach(b=>b.addEventListener('click',()=>openEditor(Number(b.dataset.si),b.dataset.date)))}
function openEditor(si,date){active={si,date};$('editorTitle').textContent=`${tr('edit')}: ${data.staff[si]}`;$('editorDate').textContent=date;$('newTask').textContent=tr('new');$('startLabel').textContent=tr('start');$('endLabel').textContent=tr('end');$('taskLabel').textContent=tr('task');$('personLabel').textContent=tr('person');$('person').placeholder=tr('personPH');$('memoLabel').textContent=tr('memo');$('close').textContent=tr('close');$('save').textContent=tr('save');$('start').innerHTML=timeOptions();$('end').innerHTML=timeOptions();$('start').value='17:00';$('end').value='24:00';$('task').innerHTML=tr('tasks').map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('');$('task').value='floor';$('person').value='';$('memo').value='';toggleMeeting();renderEntries();$('editor').showModal()}
function toggleMeeting(){$('meetingBox').classList.toggle('show',$('task').value==='meeting')}function renderEntries(){const arr=data.shifts[active.si+'|'+active.date]||[];$('entries').innerHTML=arr.map((x,i)=>`<div class="existing"><span><b>${x.start}-${x.end}</b> ${esc(taskName(x.taskId))}${x.person?' / '+esc(x.person):''}</span><button class="delete" data-index="${i}">${tr('del')}</button></div>`).join('');document.querySelectorAll('.delete').forEach(b=>b.addEventListener('click',()=>removeEntry(Number(b.dataset.index))))}function addEntry(){if(mins($('end').value)<=mins($('start').value)){alert(tr('invalid'));return}if($('task').value==='meeting'&&!$('person').value.trim()){alert(tr('required'));return}const k=active.si+'|'+active.date;if(!data.shifts[k])data.shifts[k]=[];data.shifts[k].push({start:$('start').value,end:$('end').value,taskId:$('task').value,person:$('task').value==='meeting'?$('person').value.trim():'',memo:$('memo').value.trim()});data.shifts[k].sort((a,b)=>mins(a.start)-mins(b.start));saveLocal();renderEntries();render();$('person').value='';$('memo').value=''}function removeEntry(i){if(!confirm(tr('confirm')))return;const k=active.si+'|'+active.date;data.shifts[k].splice(i,1);saveLocal();renderEntries();render()}function addStaff(){if(data.staff.length>=10)return;const n=prompt(tr('name'));if(n&&n.trim()){data.staff.push(n.trim());saveLocal();render()}}
$('language').addEventListener('change',e=>{data.lang=e.target.value;saveLocal();render()});$('addStaff').addEventListener('click',addStaff);$('print').addEventListener('click',()=>window.print());$('prev').addEventListener('click',()=>{monday.setDate(monday.getDate()-7);render()});$('next').addEventListener('click',()=>{monday.setDate(monday.getDate()+7);render()});$('task').addEventListener('change',toggleMeeting);$('close').addEventListener('click',()=>$('editor').close());$('save').addEventListener('click',addEntry);render();
</script></body></html>
